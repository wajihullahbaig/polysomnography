# PSNG pipeline settings. Relative paths resolve against the working directory.

data:
  channel: DEBIT                 # nasal airflow channel
  window_seconds: 30             # same length as the hypnogram epochs
  hop_seconds: 0                 # 0 = non-overlapping windows
  smoothing_seconds: 0.5         # moving-average kernel applied before filtering
  normalisation: recording       # recording: windows keep their amplitude relative to the night's baseline (needed for apnea detection)
                                 # window: every window is z-scored on its own (shape only)
  training:
    file_path: C:/Users/Precision/Onus/Polysomnography/Data/patient-8/p8n1.edf
    hypnogram_path: C:/Users/Precision/Onus/Polysomnography/Data/patient-8/p8n1-AhypnoEXP.txt
    start_seconds: 0             # whole night (omit end_seconds); the first 3 h are mostly wake
  validation:
    file_path: C:/Users/Precision/Onus/Polysomnography/Data/patient-8/P8N2.edf
    hypnogram_path: C:/Users/Precision/Onus/Polysomnography/Data/patient-8/hypnoP8N2.txt
    start_seconds: 0

features:
  extractor: respiratory         # respiratory | freqtimepatt | basic | hjorth | wavelet
  scale: true                    # z-score features (fitted on training) before selection / reduction
  selection:
    type: none                   # none | pca | correlation
    pca_loading: 0.5
    pca_variance: 0.9
    correlation_method: pearson
    correlation_threshold: 0.9
  reduction:
    type: pca                    # none | pca
    n_components: 3

events:                          # rule-based airflow events used as the external reference (and for AHI with a hypnogram)
  apnea_ratio: 0.1               # flow < 10 % of baseline  (AASM apnea: >= 90 % drop for >= 10 s)
  hypopnea_ratio: 0.7            # flow < 70 % of baseline  (AASM hypopnea: >= 30 % drop for >= 10 s)
  min_seconds: 10
  max_seconds: 120               # longer low-flow stretches are artefacts (sensor off)
  baseline_seconds: 600          # rolling median window for the local breathing amplitude
  min_overlap_seconds: 5         # a window takes an event label when it overlaps the event this long

oximetry:                        # SpO2 desaturations: an airflow-independent check of the events (channel: null disables)
  channel: SAT
  valid_range: [50, 100]         # values outside are probe-off dropouts
  max_gap_seconds: 10            # shorter dropouts are interpolated
  drop_percent: 3                # desaturation: SpO2 >= 3 % below the maximum of the preceding lookback (AASM 3 % rule)
  lookback_seconds: 60
  min_seconds: 3
  lag_seconds: 45                # a nadir up to 45 s after an event end confirms it (median measured lag: 18 s)

hmm:                             # hidden Markov model detector: states learned on night 1, Viterbi on both nights
  n_states: 3                    # reduced flow / normal breathing / large breaths
  smoothing_seconds: 5           # moving mean over about one breath before the log
  max_iter: 100                  # Baum-Welch iterations
  tol: 0.0001                    # log-likelihood gain per second that stops the fit

models:                          # one entry per clusterer; values are constructor arguments
  kmeans: {n_clusters: 5}
  minibatch: {n_clusters: 5}
  bisecting: {n_clusters: 5, bisecting_strategy: biggest_inertia}
  gmm: {n_components: 5}
  dbscan: {eps: 0.8, min_samples: 5}      # the feature space is one continuum: density models find few clusters
  isolation: {contamination: 0.05, eps: 0.8, min_samples: 5}

run:
  output_dir: outputs
  log_dir: logs
  log_level: INFO
  resume: true                   # reuse cached features, the fitted transformer and models when settings match
  n_jobs: -1                     # parallel workers for feature extraction (-1 = all cores)
  chunk_windows: 64              # windows per checkpoint flush
  interactive_plots: true        # also write a Plotly HTML per model
  plot_max_points: 100000        # signal is decimated to this many points in HTML plots (~9 MB files)
